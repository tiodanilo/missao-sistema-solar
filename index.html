<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Jogo educativo de clicar sobre o Sistema Solar para crianças pequenas.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Missão Sistema Solar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;900&display=swap">
<style>
/* Layout: one-screen game — progress strip, spoken instruction banner, and a big tap stage over a twinkling star canvas. Deliberately single dark theme (night sky). */
:root{
  --void:#0d1036;
  --void-2:#1c1856;
  --ink:#fbf7ff;
  --ink-soft:#c9c3ee;
  --sun:#ffc93c;
  --rocket:#ff5a4e;
  --mint:#4fe3c1;
  --lilac:#a99cff;
  --panel:rgba(255,255,255,.08);
  --panel-line:rgba(255,255,255,.16);
  --f-display:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:radial-gradient(120% 80% at 50% 0%,var(--void-2),var(--void) 60%);
  background-color:var(--void);
  color:var(--ink);font-family:var(--f-body);overflow:hidden;text-transform:uppercase;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;gap:10px;box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:4px solid var(--sun);outline-offset:3px}

/* top bar */
.top{display:flex;align-items:center;gap:10px}
.track{list-style:none;margin:0;padding:0;display:flex;align-items:center;flex:1;gap:4px;min-width:0}
.track li{flex:1;height:10px;border-radius:99px;background:var(--panel);border:1px solid var(--panel-line);transition:background .4s}
.track li.done{background:var(--mint);border-color:var(--mint)}
.track li.now{background:var(--sun);border-color:var(--sun);box-shadow:0 0 12px var(--sun)}
.icon-btn{width:46px;height:46px;border-radius:50%;background:var(--panel);border:1px solid var(--panel-line);display:grid;place-items:center;flex:none}
.icon-btn svg{width:24px;height:24px}
.icon-btn[aria-pressed="true"]{opacity:.55}

.banner{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--panel-line);border-radius:22px;padding:10px 16px;min-height:56px}
.banner .tag{font-family:var(--f-display);font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--sun);flex:none}
.banner p{margin:0;font-weight:900;font-size:clamp(1rem,min(2.6vw,3.2vh),1.75rem);line-height:1.25;text-wrap:balance}
.banner.in{animation:slideIn .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes slideIn{from{transform:translateY(-8px);opacity:.3}}

#stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;overflow-y:auto;overflow-x:hidden;gap:14px;padding-block:6px}

/* shared buttons */
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(1.25rem,min(4vw,3.6vh),2.2rem);padding:clamp(12px,2vh,20px) clamp(26px,4vh,44px);border-radius:999px}
.go-btn{background:var(--sun);color:#3a2300;box-shadow:0 6px 0 #c48a00,0 10px 24px rgba(255,201,60,.35)}
.go-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c48a00}
.ghost{font-family:var(--f-display);font-weight:800;font-size:1.1rem;padding:12px 22px;border-radius:999px;border:2px solid var(--panel-line);color:var(--ink-soft)}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}

/* intro */
.intro{display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2.2vh,22px);text-align:center;width:100%;max-width:900px}
.intro-art{width:110px;animation:hover 3s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-10px) rotate(4deg)}}
.title{font-family:var(--f-display);font-weight:800;font-size:clamp(2.4rem,9vw,4.2rem);line-height:.95;margin:0;text-wrap:balance;
  background:linear-gradient(180deg,var(--ink) 30%,var(--sun));-webkit-background-clip:text;background-clip:text;color:transparent}
.name-card{display:flex;flex-direction:column;gap:12px;width:100%;align-items:center}
.name-card label{font-weight:900;font-size:1.15rem;color:var(--ink-soft)}
.name-card input{width:100%;max-width:360px;box-sizing:border-box;font:inherit;font-family:var(--f-display);font-weight:800;font-size:1.8rem;text-align:center;
  padding:10px 16px;border-radius:20px;border:3px solid var(--lilac);background:rgba(13,16,54,.7);color:var(--ink)}
.name-card input::placeholder{color:rgba(201,195,238,.5)}

/* dress + build */
.duo{display:flex;align-items:center;justify-content:center;gap:clamp(12px,4vw,48px);width:100%;flex-wrap:wrap}
.hero-figure{width:min(58vw,48vh,400px)}
.hero-figure svg{width:100%;height:auto;overflow:visible}
.picks{display:flex;flex-direction:column;gap:clamp(10px,2.2vh,22px)}
.pick{display:flex;align-items:center;gap:12px;background:var(--panel);border:3px dashed var(--lilac);border-radius:24px;padding:10px 18px 10px 10px;
  font-family:var(--f-display);font-weight:800;font-size:clamp(1.25rem,3.6vh,2.2rem);min-width:clamp(170px,28vh,320px);animation:wiggle 2.2s ease-in-out infinite}
.pick:nth-child(2){animation-delay:.3s}.pick:nth-child(3){animation-delay:.6s}
.pick svg{width:clamp(52px,10vh,100px);height:clamp(52px,10vh,100px);flex:none}
.pick.used{opacity:.3;border-style:solid;border-color:var(--mint);animation:none}
@keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-3deg)}20%{transform:rotate(3deg)}30%{transform:rotate(0)}}
.rc{fill:var(--rc,#ff5a4e)}.rc2{fill:var(--rc2,#b8261c)}
.part{opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .35s,transform .5s cubic-bezier(.2,1.6,.4,1)}
.part.on{opacity:1;transform:scale(1)}
.flame{opacity:0;transform-box:fill-box;transform-origin:top center}
.lit .flame{opacity:1;animation:flick .12s linear infinite alternate}
@keyframes flick{from{transform:scaleY(.85)}to{transform:scaleY(1.15)}}

/* launch */
.launchpad{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.rocket-wrap{width:min(36vw,22vh,220px)}
.ghosted .part{opacity:.14;transform:none;filter:grayscale(1)}
.ghosted .part.on{opacity:1;filter:none;animation:popIn .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes popIn{from{transform:scale(.5)}}
.rocket-wrap svg{width:100%;height:auto;overflow:visible}
.pad{width:min(64vw,40vh,380px);height:16px;border-radius:8px;background:linear-gradient(90deg,#5b5891,#8b87c9,#5b5891)}
.launch{animation:liftoff 2.6s cubic-bezier(.6,0,.9,.6) forwards}
@keyframes liftoff{0%{transform:translate(0,0)}5%{transform:translate(-3px,1px)}10%{transform:translate(3px,0)}15%{transform:translate(-3px,1px)}20%{transform:translate(3px,0)}25%{transform:translate(0,-10px)}100%{transform:translate(0,-140vh)}}
.red-btn{margin-top:14px;width:clamp(120px,min(34vw,22vh),220px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8f85,var(--rocket) 55%,#b8261c);
  box-shadow:0 10px 0 #8a1a12,0 0 0 10px rgba(255,90,78,.2),0 0 40px rgba(255,90,78,.5);font-family:var(--f-display);font-weight:800;font-size:clamp(1.4rem,3.6vh,2.2rem);color:#fff;letter-spacing:.04em;animation:pulse 1.2s ease-in-out infinite}
.red-btn:active{transform:translateY(6px);box-shadow:0 4px 0 #8a1a12}
.count{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-family:var(--f-display);font-weight:800;font-size:clamp(7rem,30vw,13rem);color:var(--sun);text-shadow:0 0 30px rgba(255,201,60,.6)}
.count b{animation:zoom .9s ease-out both}
@keyframes zoom{from{transform:scale(2.2);opacity:0}30%{opacity:1;transform:scale(1)}to{transform:scale(.8);opacity:.2}}

/* fields (asteroids, stars) */
.field{position:relative;width:100%;max-width:1200px;flex:1;min-height:320px}
.asteroid{position:absolute;width:var(--sz);height:var(--sz);left:calc(var(--x) - var(--sz)/2);top:calc(var(--y) - var(--sz)/2);
  border-radius:48% 52% 41% 59%/56% 44% 56% 44%;
  background:radial-gradient(circle at 62% 38%,#5b524c 0 9%,transparent 10%),radial-gradient(circle at 34% 66%,#5b524c 0 7%,transparent 8%),radial-gradient(circle at 70% 72%,#5b524c 0 5%,transparent 6%),radial-gradient(circle at 30% 28%,#b3aaa1,#7a716a 55%,#463f3a);
  box-shadow:inset -8px -10px 18px rgba(0,0,0,.4);animation:drift 3.4s ease-in-out infinite;transition:transform .25s,opacity .25s}
.asteroid.gone{transform:scale(0) rotate(90deg)!important;opacity:0;pointer-events:none;animation:none}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(6px,-12px) rotate(14deg)}}
.meter{display:flex;gap:10px;justify-content:center}
.meter i{width:clamp(24px,4vh,38px);height:clamp(24px,4vh,38px);border-radius:50%;border:3px solid var(--panel-line);transition:background .3s,transform .3s}
.meter i.on{background:var(--mint);border-color:var(--mint);transform:scale(1.2)}

.star{position:absolute;width:var(--sz);height:var(--sz);left:calc(var(--x) - var(--sz)/2);top:calc(var(--y) - var(--sz)/2);animation:twinkle 1.6s ease-in-out infinite;transition:transform .3s,opacity .3s}
.star svg{width:100%;height:100%;filter:drop-shadow(0 0 10px rgba(255,201,60,.8))}
.star.gone{transform:scale(2.2)!important;opacity:0;pointer-events:none;animation:none}
@keyframes twinkle{50%{transform:scale(1.15) rotate(12deg)}}
.fuel{display:flex;align-items:center;gap:12px;width:100%;max-width:760px}
.fuel span{font-family:var(--f-display);font-weight:800;font-size:clamp(1.1rem,3vh,1.8rem);color:var(--sun)}
.fuel .bar{flex:1;height:clamp(24px,4.5vh,40px);border-radius:99px;background:var(--panel);border:2px solid var(--panel-line);overflow:hidden}
.fuel .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sun),#ff9a1f);transition:width .5s cubic-bezier(.2,1.4,.4,1)}
.earth-home{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(66vw,52vh,420px);aspect-ratio:1;display:grid;place-items:center;animation:rise .9s cubic-bezier(.2,1.3,.4,1) both}
.earth-home .planet{width:100%;box-shadow:0 0 50px rgba(79,170,255,.6)}
.earth-home .pulse{display:block}
@keyframes rise{from{transform:translate(-50%,40%) scale(.3);opacity:0}}

/* planets */
.planet{display:block;position:relative;aspect-ratio:1;border-radius:50%;width:calc(var(--s,1) * var(--pb,min(84px,18vw)));margin:auto}
.planet::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.35),transparent 35%,rgba(0,0,30,.5) 85%)}
.p-mercurio{background:radial-gradient(circle at 60% 40%,#8c857d 0 8%,transparent 9%),radial-gradient(circle at 35% 65%,#8c857d 0 6%,transparent 7%),#bdb6ad}
.p-venus{background:linear-gradient(160deg,#fff1c7,#f0c26a 45%,#d6913e)}
.p-terra{background:radial-gradient(ellipse 26% 20% at 32% 38%,#5cc46a 60%,transparent 64%),radial-gradient(ellipse 18% 28% at 66% 62%,#5cc46a 60%,transparent 64%),radial-gradient(ellipse 30% 9% at 50% 8%,#fff 50%,transparent 60%),#3a8ee6}
.p-marte{background:radial-gradient(circle at 60% 60%,#b23c1f 0 10%,transparent 12%),radial-gradient(circle at 30% 40%,#c94b28 0 8%,transparent 10%),#e2683c}
.p-jupiter{background:radial-gradient(ellipse 15% 9% at 62% 64%,#c2452c 70%,transparent 76%),linear-gradient(180deg,#e9d2a8 0 12%,#c98f5a 12% 22%,#f1e0c0 22% 34%,#b8794a 34% 44%,#ecd6b0 44% 58%,#c58a57 58% 70%,#efdcbc 70% 84%,#b9804f 84%)}
.p-saturno{background:linear-gradient(180deg,#f3dfa6 0 30%,#dcbd73 30% 45%,#f0d898 45% 65%,#cfae66 65%)}
.p-saturno::before{content:"";position:absolute;left:-38%;right:-38%;top:38%;height:24%;border-radius:50%;border:5px solid rgba(240,216,152,.9);transform:rotate(-16deg);z-index:2}
.p-urano{background:linear-gradient(170deg,#c7f6fa,#86dbe6)}
.p-netuno{background:radial-gradient(ellipse 14% 8% at 40% 55%,#21319a 70%,transparent 76%),linear-gradient(170deg,#5d80f2,#2c49c4)}
.p-lua{background:radial-gradient(circle at 30% 35%,#b9b6c8 0 9%,transparent 10%),radial-gradient(circle at 65% 60%,#b9b6c8 0 12%,transparent 13%),radial-gradient(circle at 45% 78%,#b9b6c8 0 6%,transparent 7%),radial-gradient(circle at 75% 28%,#b9b6c8 0 5%,transparent 6%),#e2e0ec}

.system{display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2.4vh,26px);width:100%;max-width:1300px;--pb:min(19vw,15vh,150px)}
.sun{width:100%;height:clamp(70px,13vh,140px);border-radius:0 0 50% 50%/0 0 100% 100%;background:radial-gradient(120% 200% at 50% 0%,#fff6c2,var(--sun) 35%,#ff9a1f 70%);box-shadow:0 0 40px rgba(255,180,40,.55);
  font-family:var(--f-display);font-weight:800;font-size:clamp(1.2rem,3.4vh,2.2rem);color:#6b3a00}
.orbit{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%}
@media (min-width:760px){.orbit{grid-template-columns:repeat(8,minmax(0,1fr))}}
.pl-btn,.opt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.6vh,16px);min-height:calc(var(--pb) + 50px);border-radius:22px;padding:10px 4px;transition:transform .2s,background .2s}
.pl-btn:active,.opt:active{transform:scale(.94)}
.pl-btn.seen{background:var(--panel)}
.pl-btn.seen::after{content:"";position:absolute;top:6px;right:6px;width:22px;height:22px;background:var(--sun);
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.pl-btn.active{background:rgba(255,201,60,.18);outline:3px solid var(--sun)}
.pl-name{font-family:var(--f-display);font-weight:800;font-size:clamp(.85rem,min(2.6vw,2.6vh),1.5rem);line-height:1}
.fact{display:flex;align-items:center;gap:clamp(14px,2.4vh,26px);width:100%;box-sizing:border-box;min-height:clamp(84px,15vh,170px);--pb:min(22vw,18vh,170px);background:var(--panel);border:1px solid var(--panel-line);border-radius:22px;padding:12px 16px}
.fact .planet{--s:.62;margin:0;flex:none}
.fact h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(1.4rem,4vh,2.6rem);color:var(--sun);line-height:1}
.fact p{margin:4px 0 0;font-weight:700;font-size:clamp(1.05rem,2.8vh,1.7rem);line-height:1.3;max-width:60ch}
.fact{position:relative}
.fact>div{min-width:0;flex:1;padding-right:clamp(48px,9vh,110px)}
.fact .count-seen{position:absolute;top:12px;right:16px;font-family:var(--f-display);font-weight:800;color:var(--mint);font-size:clamp(1.1rem,3vh,1.8rem);flex:none;font-variant-numeric:tabular-nums}

/* moon */
.moonscape{display:flex;flex-direction:column;align-items:center;gap:22px;width:100%;padding-top:calc(min(68vw,50vh,480px)*.32)}
.moon{position:relative;width:min(68vw,50vh,480px);aspect-ratio:1;border-radius:50%;box-shadow:0 0 60px rgba(226,224,236,.35)}
.moon .planet{position:absolute;inset:0;width:100%;margin:0}
.mini-rocket{position:absolute;width:22%;left:-22%;top:-52%;transform:rotate(40deg);transition:left 1.4s cubic-bezier(.4,0,.2,1),top 1.4s cubic-bezier(.4,0,.2,1),transform 1.4s;z-index:3}
.mini-rocket svg{width:100%;height:auto;overflow:visible}
.mini-rocket.landed{left:16%;top:-31%;transform:rotate(-16deg)}
.flag{position:absolute;left:63%;top:-27%;width:4px;height:30%;background:#d9d6ea;transform-origin:bottom;transform:scaleY(0);transition:transform .6s cubic-bezier(.2,1.5,.4,1);z-index:3}
.flag.on{transform:scaleY(1)}
.flag b{position:absolute;left:4px;top:0;white-space:nowrap;background:var(--rc,var(--rocket));color:#fff;font-family:var(--f-display);font-weight:800;font-size:clamp(.8rem,min(3vw,3vh),1.6rem);padding:4px 10px 3px;border-radius:0 8px 8px 0}

/* quiz */
.quiz{display:flex;flex-direction:column;align-items:center;gap:clamp(20px,4vh,40px);width:100%;max-width:1100px;--pb:min(24vw,30vh,230px)}
.qdots{display:flex;gap:10px}
.qdots i{width:clamp(16px,2.6vh,26px);height:clamp(16px,2.6vh,26px);border-radius:50%;background:var(--panel);border:2px solid var(--panel-line)}
.qdots i.on{background:var(--mint);border-color:var(--mint)}
.qdots i.now{background:var(--sun);border-color:var(--sun)}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
.opt{background:var(--panel);border:3px solid var(--panel-line);padding-block:clamp(14px,3vh,30px)}
.opt .pl-name{font-size:clamp(1rem,min(3.4vw,3.4vh),2.2rem)}
.opt .planet{--s:.9}
.opt.right{border-color:var(--mint);background:rgba(79,227,193,.18);transform:scale(1.06)}
.opt.dim{opacity:.4}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* finale */
.finale{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,20px);text-align:center;max-width:760px}
.medal{width:min(56vw,40vh,320px);height:auto;animation:swing 2.4s ease-in-out infinite;transform-origin:top center}
@keyframes swing{50%{transform:rotate(5deg)}}
.finale h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,7vw,3rem);line-height:1;color:var(--sun)}
.finale p{margin:0;font-weight:700;font-size:clamp(1.1rem,2.8vh,1.6rem);line-height:1.4;color:var(--ink-soft);text-wrap:balance}
.finale p b{color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:8px}

/* celebration + particles */
#cheer{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:20}
#cheer b{font-family:var(--f-display);font-weight:800;font-size:clamp(3rem,13vw,6rem);color:var(--sun);text-shadow:0 6px 0 #b86f00,0 0 40px rgba(255,201,60,.6);text-align:center;line-height:1;padding-inline:16px}
#cheer.go b{animation:pop 2.4s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.2) rotate(-10deg);opacity:0}15%{transform:scale(1) rotate(0);opacity:1}85%{opacity:1}100%{opacity:0;transform:scale(1.1)}}
.bit{position:fixed;width:12px;height:12px;border-radius:3px;z-index:30;pointer-events:none;animation:fly .85s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(360deg) scale(.3);opacity:0}}



/* coloring */
.paint{display:flex;align-items:center;justify-content:center;gap:clamp(14px,3vh,30px);width:100%;flex-wrap:wrap}
.canvas{width:min(100%,92vh,860px);max-width:100%;height:auto;border-radius:24px;flex:0 1 auto}
@media (min-aspect-ratio:4/3){.canvas{width:min(72vw,92vh,860px)}}
.reg{cursor:pointer;transition:fill .25s}
.splash{animation:splash .35s ease-out;transform-box:fill-box;transform-origin:center}
@keyframes splash{40%{transform:scale(1.06)}}
.palette{display:grid;grid-template-columns:repeat(4,clamp(48px,min(13vw,9vh),84px));gap:clamp(8px,1.6vh,16px)}
@media (min-aspect-ratio:4/3){.palette{grid-template-columns:repeat(2,clamp(48px,9vh,84px))}}
.swatch{aspect-ratio:1;border-radius:50%;background:var(--c);border:4px solid rgba(255,255,255,.25);box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .2s}
.swatch.sel{border-color:#fff;transform:scale(1.14);box-shadow:0 0 0 4px var(--c),0 4px 0 rgba(0,0,0,.35)}
.paint .go-btn{flex-basis:100%;max-width:max-content}
/* dwarf planets */
.dwarf{display:block;width:calc(var(--pb) * 1.35);height:auto;margin:auto;overflow:visible}
.dw{--pb:min(20vw,22vh,190px)}
.dwarfs{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:700px){.dwarfs{grid-template-columns:repeat(4,minmax(0,1fr))}}
.fact-body{flex:none;--pb:min(16vw,12vh,110px)}
.opt .dwarf{width:calc(var(--pb) * 1.1)}
/* voice picker */
.voice-btn{font-family:var(--f-body);font-weight:900;font-size:clamp(.8rem,1.8vh,1rem);letter-spacing:.06em;color:var(--ink-soft);padding:8px 16px;border-radius:999px;border:1px dashed var(--panel-line);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* home confirm */
.ask{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(8,9,30,.75);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ask-card{background:var(--void-2);border:2px solid var(--panel-line);border-radius:28px;padding:24px 28px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.ask-card p{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(1.4rem,5vw,2rem);line-height:1.1}
@media (max-width:420px){.icon-btn{width:40px;height:40px}.icon-btn svg{width:20px;height:20px}.top{gap:6px}}
/* alphabet */
.name-box{min-height:clamp(68px,11vh,110px);width:100%;max-width:820px;display:flex;justify-content:center;align-items:center;gap:2px;flex-wrap:wrap;box-sizing:border-box;
  background:rgba(13,16,54,.7);border:3px solid var(--lilac);border-radius:20px;padding:4px 12px;font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,min(8vw,7vh),4rem);line-height:1.1;letter-spacing:.06em;color:var(--sun)}
.name-box span{animation:zoomIn .3s cubic-bezier(.2,1.6,.4,1)}
.name-box em{font-style:normal;font-family:var(--f-body);font-size:1rem;letter-spacing:.06em;color:var(--ink-soft);opacity:.7}
@keyframes zoomIn{from{transform:scale(.2)}}
.caret{width:4px;height:.9em;background:var(--sun);margin-left:3px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.keys{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(6px,1.4vh,12px);width:100%;max-width:min(900px,100%)}
.key{height:clamp(44px,min(11vw,8.5vh),88px);border-radius:16px;background:var(--k);color:#1a1440;font-family:var(--f-display);font-weight:800;font-size:clamp(1.4rem,min(5.5vw,5vh),2.8rem);line-height:1;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.key:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.key-del{background:var(--panel);color:var(--ink);border:2px solid var(--panel-line);display:grid;place-items:center}
.key-del svg{width:60%;height:60%}
.go-btn:disabled{opacity:.35;box-shadow:none;cursor:default;animation:none}
.intro .title{font-size:clamp(1.9rem,min(7vw,7vh),4rem)}

/* moon walk */
.lunar{position:relative;width:100%;max-width:1100px;flex:1;min-height:340px;overflow:hidden;border-radius:24px}
.surface{position:absolute;left:-15%;right:-15%;bottom:0;height:34%;border-radius:50% 50% 0 0/45% 45% 0 0;
  background:radial-gradient(ellipse 9% 14% at 22% 40%,#b0adc4 60%,transparent 64%),radial-gradient(ellipse 12% 16% at 70% 55%,#b0adc4 60%,transparent 64%),radial-gradient(ellipse 6% 9% at 48% 75%,#b0adc4 60%,transparent 64%),#d6d4e4}
.sky-earth{position:absolute!important;right:8%;top:8%;--s:1;--pb:min(20vw,16vh,140px);margin:0!important}
.lunar-astro{position:absolute;left:50%;bottom:20%;width:min(38vw,28vh,230px);margin-left:calc(min(38vw,28vh,230px)/-2)}
.lunar-astro svg{width:100%;height:auto;overflow:visible}
.lunar-astro.jump{animation:moonjump 1.7s cubic-bezier(.35,.8,.45,1)}
@keyframes moonjump{0%{transform:translateY(0)}12%{transform:translateY(6px) scaleY(.92)}55%{transform:translateY(-150%) rotate(10deg)}100%{transform:translateY(0)}}
.shapes{display:flex;flex-direction:column;align-items:center;gap:16px}
.moon-disc{position:relative;width:min(72vw,48vh,440px);aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 0 50px rgba(226,224,236,.4)}
.moon-disc .planet{position:absolute;inset:0;width:100%;margin:0}
.shade{position:absolute;inset:-3%;border-radius:50%;background:rgba(14,16,48,.93);transform:translateX(-120%);transition:transform 1s ease;z-index:2}
.shape-name{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,min(7vw,6vh),3.4rem);color:var(--sun);line-height:1}

/* sun */
.sunzone{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%}
.sun-astro{width:min(30vw,36vh,260px)}
.sun-astro svg{width:100%;height:auto;overflow:visible}
.sun-big{position:relative;width:min(52vw,50vh,460px);aspect-ratio:1;transform:scale(var(--g,1));transition:transform .6s cubic-bezier(.2,1.5,.4,1),filter .6s}
.sun-big:disabled{cursor:default}
.sun-big .core{position:absolute;inset:16%;border-radius:50%;background:radial-gradient(circle at 40% 38%,#fff6c2,var(--sun) 40%,#ff9a1f 80%,#f06a1a);box-shadow:0 0 60px rgba(255,170,40,.8);transition:box-shadow .6s}
.sun-big .rays{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(rgba(255,201,60,.9) 0 7deg,transparent 7deg 22.5deg);
  -webkit-mask:radial-gradient(circle,transparent 36%,#000 38%,#000 60%,transparent 71%);mask:radial-gradient(circle,transparent 36%,#000 38%,#000 60%,transparent 71%);animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.glare .sun-big{filter:brightness(1.7) saturate(.4)}
.glare .sun-big .core{box-shadow:0 0 120px 70px rgba(255,248,214,.9)}
.p-sol{background:radial-gradient(circle at 40% 38%,#fff6c2,#ffc93c 45%,#ff9a1f)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
  .launch{animation:none;transform:translateY(-140vh);transition:transform 1.5s}
}
@media (max-width:420px){
  .banner .tag{display:none}
  .pick{min-width:0;font-size:1.15rem}
  .pick svg{width:46px;height:46px}
  .opt{min-height:140px}
}
</style>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>
<div id="app">
  <div class="top">
    <button class="icon-btn" id="home" aria-label="Voltar ao início">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
    </button>
    <ol class="track" id="track" aria-label="Fases da missão"></ol>
    <button class="icon-btn" id="replay" aria-label="Ouvir de novo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
    <button class="icon-btn" id="fs" aria-label="Tela cheia">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><g id="fsOn"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></g><g id="fsOff" style="display:none"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></g></svg>
    </button>
    <button class="icon-btn" id="mute" aria-label="Som ligado" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3" fill="currentColor"/><circle cx="17" cy="16" r="3" fill="currentColor"/></svg>
    </button>
  </div>
  <div class="banner" id="banner"><span class="tag" id="tag">Missão</span><p id="msg" aria-live="polite"></p></div>
  <main id="stage"></main>
</div>
<div id="cheer" hidden><b></b></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><radialGradient id="shd" cx=".32" cy=".28" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#00001e" stop-opacity=".5"/></radialGradient></defs></svg>
<div class="ask" id="ask" hidden><div class="ask-card"><p>Voltar para o início?</p><div class="row"><button class="big go-btn" id="askYes">Sim</button><button class="ghost" id="askNo">Não</button></div></div></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const stage=$('#stage'),msg=$('#msg');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const NUM=['um','dois','três','quatro','cinco','seis','sete','oito'];
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const ROCKETS=[['#ff5a4e','#b8261c'],['#3f8cff','#1d4fb8'],['#9b6bff','#5b33b8'],['#25c7a0','#127a62'],['#ff8a1f','#b85a00']];
let G={};
function spots(n){
  const cols=n>6?4:3,rows=n>3?(n>8?3:2+(n>6?1:0)):2;
  const cells=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)cells.push([(c+.5)/cols*100,(r+.5)/rows*100]);
  const jx=30/cols,jy=30/rows;
  return shuffle(cells).slice(0,n).map(([x,y])=>[x+(Math.random()-.5)*jx,y+(Math.random()-.5)*jy]);
}
function newGame(){
  const rc=pick(ROCKETS);document.documentElement.style.setProperty('--rc',rc[0]);document.documentElement.style.setProperty('--rc2',rc[1]);
  G={asteroids:ri(4,8),stars:ri(3,7),jumps:ri(2,4),dressOrder:shuffle(['helmet','pack','boots']),buildOrder:shuffle(['nose','body','fins'])};
}
const TAGS=['Missão','Roupa espacial','Foguete','Decolagem','Asteroides','Pouso na Lua','Explorar a Lua','Hora de pintar','O Sol','Planetas','Planetas anões','Perguntas','Volta para casa','Medalha'];
const state={name:'',phase:0};
let muted=false,timers=[];
const later=(fn,ms)=>{const t=setTimeout(fn,ms);timers.push(t);return t};

/* ---------- voice ---------- */
let voice=null,voices=[];
/* best Brazilian voices first; Portugal Portuguese only as a last resort */
function rankVoice(v){
  let sc=/pt[-_]BR/i.test(v.lang)?100:/^pt/i.test(v.lang)?20:-999;
  if(/natural|neural|online|enhanced|premium|aprimorad/i.test(v.name))sc+=40;
  if(/google/i.test(v.name))sc+=30;
  if(/francisca|antonio|thalita|luciana|felipe|maria/i.test(v.name))sc+=10;
  return sc;
}
function pickVoice(){try{
  voices=speechSynthesis.getVoices().filter(v=>rankVoice(v)>0).sort((a,b)=>rankVoice(b)-rankVoice(a));
  let saved='';try{saved=localStorage.getItem('missao-voz')||''}catch(e){}
  voice=voices.find(v=>v.name===saved)||voices[0]||null;
  const vb=document.getElementById('voiceBtn');if(vb)vb.textContent=voiceLabel();
}catch(e){}}
function voiceLabel(){
  if(!('speechSynthesis' in window))return 'Sem voz neste aparelho';
  if(!voice)return 'Sem voz em português';
  return 'Voz: '+voice.name.replace(/microsoft|google|online|\(natural\)|-.*$|portuguese|português|\(brazil\)|\(brasil\)|do brasil/gi,'').trim();
}
if('speechSynthesis' in window){pickVoice();try{speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch(e){try{speechSynthesis.onvoiceschanged=pickVoice}catch(_){}}}
/* spoken spelling only: the screen keeps the normal words */
const SPEAK=[
  ['asteroides','asteróides'],['asteroide','asteróide'],
  ['Haumea','Rauméia'],['Ceres','Céres'],['Plutão','Plutão'],
  ['letra C','letra cê'],['Uhuu','Uhú'],['Iupi','Iupí'],['Oba','Ôba']
];
const SPEAK_RE=SPEAK.map(([w,r])=>[new RegExp('(^|[^\\p{L}])'+w+'(?![\\p{L}])','giu'),r]);
function speakable(t){let o=' '+t;for(const [re,r] of SPEAK_RE)o=o.replace(re,(m,pre)=>pre+r);return o.trim()}
function say(t){
  if(muted||!('speechSynthesis' in window))return;
  try{if(!voice)pickVoice();speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(speakable(t));u.lang=voice?voice.lang:'pt-BR';if(voice)u.voice=voice;u.rate=.95;u.pitch=1.05;speechSynthesis.speak(u)}catch(e){}
}
let lastLine='';
function tell(t){
  msg.textContent=t;lastLine=t;say(t);
  const b=$('#banner');b.classList.remove('in');void b.offsetWidth;b.classList.add('in');
}

/* ---------- sound ---------- */
let ac=null;
function ctx(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}return ac}
function tone(f,d=.15,type='sine',vol=.16,delay=0,f2){
  if(muted)return;const a=ctx();if(!a)return;
  try{const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03)}catch(e){}
}
const sfx={
  pop(){tone(660,.12,'triangle');tone(990,.14,'triangle',.12,.07)},
  boom(){tone(180,.35,'sawtooth',.14,0,50);tone(90,.4,'square',.08,.03,40)},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.15,i*.11))},
  oops(){tone(330,.18,'sine',.14);tone(250,.28,'sine',.14,.14)},
  beep(){tone(880,.22,'square',.09)},
  launch(){tone(70,2.4,'sawtooth',.16,0,520);tone(110,2.2,'triangle',.12,.1,700)},
  land(){tone(600,1.2,'sine',.12,0,120)},
  ding(n){tone(523*Math.pow(1.122,n),.3,'triangle',.15)}
};

/* ---------- stars ---------- */
const cv=$('#sky'),cx=cv.getContext('2d');let W=0,H=0,stars=[],warp=0;
function resize(){const r=devicePixelRatio||1;W=cv.width=innerWidth*r;H=cv.height=innerHeight*r;
  stars=Array.from({length:170},()=>({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.5+.4)*r,p:Math.random()*6.28,s:Math.random()*.6+.3}))}
function draw(t){
  cx.clearRect(0,0,W,H);const r=devicePixelRatio||1;
  for(const s of stars){
    if(warp){s.y+=s.s*34*r*warp;if(s.y>H){s.y=-20;s.x=Math.random()*W}}
    const a=reduce?.8:.45+.55*Math.abs(Math.sin(t/700+s.p));
    cx.fillStyle='rgba(255,248,228,'+a+')';
    if(warp)cx.fillRect(s.x,s.y,s.r*1.2,s.r*14*warp);
    else{cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.283);cx.fill()}
  }
  requestAnimationFrame(draw);
}
addEventListener('resize',resize);resize();requestAnimationFrame(draw);

/* ---------- effects ---------- */
const PARTY=['#ffc93c','#ff5a4e','#4fe3c1','#a99cff','#fbf7ff'];
function burst(x,y,colors=PARTY,n=16){
  for(let i=0;i<n;i++){const p=document.createElement('i');p.className='bit';
    const a=Math.random()*6.283,d=60+Math.random()*110;
    p.style.cssText='left:'+x+'px;top:'+y+'px;background:'+colors[i%colors.length]+';--dx:'+(Math.cos(a)*d)+'px;--dy:'+(Math.sin(a)*d)+'px';
    document.body.appendChild(p);setTimeout(()=>p.remove(),900)}
}
function burstAt(el,c,n){const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,c,n)}
function cheer(word,line,next,wait=2700){
  const c=$('#cheer');c.querySelector('b').textContent=word;c.hidden=false;c.classList.remove('go');void c.offsetWidth;c.classList.add('go');
  sfx.win();tell(line);burst(innerWidth/2,innerHeight/2,PARTY,34);
  later(()=>{c.hidden=true;next&&next()},wait);
}

/* ---------- drawings ---------- */
function astroSVG(full){const c=full?'part on':'part';return `
<svg viewBox="0 0 200 260" role="img" aria-label="Astronauta">
  <g id="a-pack" class="${c}"><rect x="50" y="102" width="100" height="92" rx="16" fill="#9d97cf"/><rect x="60" y="112" width="12" height="30" rx="5" fill="#ffc93c"/><rect x="128" y="112" width="12" height="30" rx="5" fill="#4fe3c1"/></g>
  <rect x="38" y="118" width="26" height="62" rx="13" fill="#eceaf8" transform="rotate(14 51 118)"/>
  <rect x="136" y="118" width="26" height="62" rx="13" fill="#eceaf8" transform="rotate(-14 149 118)"/>
  <circle cx="44" cy="180" r="12" fill="#ff5a4e"/><circle cx="156" cy="180" r="12" fill="#ff5a4e"/>
  <rect x="72" y="182" width="24" height="50" rx="10" fill="#eceaf8"/><rect x="104" y="182" width="24" height="50" rx="10" fill="#eceaf8"/>
  <rect x="62" y="104" width="76" height="92" rx="24" fill="#fbf7ff"/>
  <rect x="62" y="168" width="76" height="10" fill="#c9c3ee"/>
  <rect x="84" y="126" width="32" height="22" rx="6" fill="#a99cff"/><circle cx="92" cy="137" r="4" fill="#ffc93c"/><circle cx="108" cy="137" r="4" fill="#ff5a4e"/>
  <g id="a-boots" class="${c}"><rect x="66" y="222" width="34" height="24" rx="10" class="rc"/><rect x="100" y="222" width="34" height="24" rx="10" class="rc"/><rect x="66" y="238" width="34" height="8" rx="4" class="rc2"/><rect x="100" y="238" width="34" height="8" rx="4" class="rc2"/></g>
  <circle cx="100" cy="72" r="32" fill="#f2c3a0"/>
  <path d="M70 62 Q78 34 104 38 Q128 40 132 64 Q118 50 100 52 Q84 50 70 62Z" fill="#5a3a26"/>
  <circle cx="89" cy="74" r="4.5" fill="#2a1b12"/><circle cx="111" cy="74" r="4.5" fill="#2a1b12"/>
  <circle cx="90.5" cy="72.5" r="1.4" fill="#fff"/><circle cx="112.5" cy="72.5" r="1.4" fill="#fff"/>
  <circle cx="81" cy="84" r="5" fill="#ff9b8a" opacity=".6"/><circle cx="119" cy="84" r="5" fill="#ff9b8a" opacity=".6"/>
  <path d="M90 87 Q100 96 110 87" stroke="#2a1b12" stroke-width="3" fill="none" stroke-linecap="round"/>
  <g id="a-helmet" class="${c}"><circle cx="100" cy="72" r="47" fill="rgba(140,205,255,.22)" stroke="#fbf7ff" stroke-width="7"/><path d="M68 50 Q78 32 98 30" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" opacity=".85"/><rect x="72" y="112" width="56" height="10" rx="5" fill="#c9c3ee"/></g>
  <g id="a-visor" class="part"><path d="M57 70 A43 43 0 0 1 143 70 Q100 86 57 70Z" fill="rgba(255,184,40,.82)"/><path d="M72 52 Q82 40 98 37" stroke="#fff6c2" stroke-width="4" fill="none" stroke-linecap="round"/></g>
</svg>`}
const ICON={
  helmet:`<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="22" fill="rgba(140,205,255,.3)" stroke="#fbf7ff" stroke-width="5"/><path d="M16 22 Q21 12 31 11" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`,
  pack:`<svg viewBox="0 0 60 60"><rect x="12" y="10" width="36" height="42" rx="9" fill="#9d97cf"/><rect x="18" y="16" width="7" height="16" rx="3" fill="#ffc93c"/><rect x="35" y="16" width="7" height="16" rx="3" fill="#4fe3c1"/></svg>`,
  boots:`<svg viewBox="0 0 60 60"><rect x="6" y="20" width="22" height="26" rx="8" class="rc"/><rect x="32" y="20" width="22" height="26" rx="8" class="rc"/><rect x="6" y="40" width="22" height="7" rx="3" class="rc2"/><rect x="32" y="40" width="22" height="7" rx="3" class="rc2"/></svg>`,
  nose:`<svg viewBox="0 0 60 60"><path d="M10 52 Q30 -4 50 52Z" class="rc"/></svg>`,
  body:`<svg viewBox="0 0 60 60"><rect x="16" y="4" width="28" height="52" rx="6" fill="#fbf7ff" stroke="#c9c3ee" stroke-width="2"/><circle cx="30" cy="24" r="8" fill="#6fd3ff" stroke="#8c86b8" stroke-width="3"/></svg>`,
  fins:`<svg viewBox="0 0 60 60"><path d="M22 10 L4 50 L22 44Z" class="rc"/><path d="M38 10 L56 50 L38 44Z" class="rc"/></svg>`
};
function rocketSVG(full){const c=full?'part on':'part';return `
<svg viewBox="0 0 120 240" role="img" aria-label="Foguete">

function save(){try{localStorage.setItem('missao-solar',JSON.stringify({name:state.name}))}catch(e){}}
function go(n){

  $('#track').innerHTML=Array.from({length:12},(_,i)=>`<li class="${i+1<n?'done':i+1===n?'now':''}"></li>`).join('');
  stage.scrollTop=0;
  (PHASES[n])();
}

  tell('Agora os planetas! Toque em cada planeta para conhecer.');
  const seen=new Set();
  const show=(cls,name,text)=>{$('#fact').innerHTML=`${cls?`<span class="planet ${cls}"></span>`:''}<div><h3>${name}</h3><p>${text}</p></div><span class="count-seen">${seen.size} de 8</span>`};
  $('#sun').onclick=()=>{sfx.pop();const t='O Sol fica no meio, e todos os planetas giram em volta dele.';show('p-sol','Sol',t);msg.textContent=t;say(t)};
  $('#orbit').onclick=e=>{const b=e.target.closest('.pl-btn');if(!b)return;
    const p=PL[+b.dataset.i];document.querySelectorAll('.pl-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active','seen');seen.add(p.k);sfx.ding(+b.dataset.i);burstAt(b,PARTY,10);
    const ff=Math.random()<.5?p.f:p.f2;let t=`${p.n}! ${ff}`;
    if(seen.size===8&&$('#next').hidden){t+=` Você visitou todos os planetas, ${state.name}!`;$('#next').hidden=false}
    show('p-'+p.k,p.n,ff);msg.textContent=t;say(t)};
  $('#next').onclick=()=>{sfx.pop();go(10)};
},
/* 10 — dwarf planets */
()=>{
  stage.innerHTML=`<div class="system dw">
    <div class="orbit dwarfs" id="orbit">${DW.map((d,i)=>`<button class="pl-btn" data-i="${i}">${body(d.k)}<span class="pl-name">${d.n}</span></button>`).join('')}</div>
    <div class="fact" id="fact"><div><h3>Planetas anões</h3><p>São planetas pequenininhos que moram longe, junto com muitas pedras e gelo.</p></div><span class="count-seen">0 de 4</span></div>
    <button class="big go-btn pulse" id="next" hidden>Próxima missão</button></div>`;
  tell('Agora vamos conhecer os planetas anões! Eles são bem pequenininhos. Toque em cada um.');
  const seen=new Set();
  $('#orbit').onclick=e=>{const b=e.target.closest('.pl-btn');if(!b)return;
    const d=DW[+b.dataset.i];document.querySelectorAll('.pl-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active','seen');seen.add(d.k);sfx.ding(+b.dataset.i*2);burstAt(b,PARTY,10);
    let t=`${d.n}! ${d.f}`;
    if(seen.size===4&&$('#next').hidden){t+=` Você conheceu os quatro planetas anões!`;$('#next').hidden=false}
    $('#fact').innerHTML=`<span class="fact-body">${body(d.k)}</span><div><h3>${d.n}</h3><p>${d.f}</p></div><span class="count-seen">${seen.size} de 4</span>`;
    msg.textContent=t;say(t)};
  $('#next').onclick=()=>{sfx.pop();go(11)};
},
/* 11 — quiz */
()=>{
  const BANK=[
    {q:'Qual é o planeta onde a gente mora?',a:'terra',w:['marte','netuno','jupiter','venus']},
    {q:'Qual planeta tem anéis?',a:'saturno',w:['venus','mercurio','marte','terra']},
    {q:'Qual destes é uma estrela?',a:'sol',w:['lua','marte','terra','urano']},
    {q:'Onde você fincou a sua bandeira?',a:'lua',w:['jupiter','sol','netuno']},
    {q:'Qual é o planeta vermelho?',a:'marte',w:['urano','terra','netuno','saturno']},
    {q:'Qual é o maior planeta de todos?',a:'jupiter',w:['mercurio','marte','terra']},
    {q:'Qual é o planeta mais pertinho do Sol?',a:'mercurio',w:['netuno','jupiter','saturno']},
    {q:'Qual é o planeta mais quente?',a:'venus',w:['urano','netuno','terra']},
    {q:'O que dá luz e calor para a Terra?',a:'sol',w:['lua','netuno','saturno']},
    {q:'Qual planeta gira deitado, de lado?',a:'urano',w:['terra','marte','jupiter']},
    {q:'Qual planeta fica mais longe do Sol?',a:'netuno',w:['mercurio','venus','terra']},
    {q:'O que muda de forma no céu: nova, cheia, crescente?',a:'lua',w:['sol','jupiter','marte']},
    {q:'Qual planeta tem uma mancha vermelha gigante?',a:'jupiter',w:['saturno','venus','urano']},
    {q:'Em qual lugar não tem ar e o astronauta pula alto?',a:'lua',w:['terra','sol']},
    {q:'Qual planeta anão tem um coração desenhado?',a:'plutao',w:['ceres','eris','haumea']},
    {q:'Qual planeta anão tem formato de ovo?',a:'haumea',w:['plutao','ceres','eris']},
    {q:'Qual planeta anão é branquinho como neve?',a:'eris',w:['ceres','plutao']},
    {q:'Qual planeta anão mora entre Marte e Júpiter?',a:'ceres',w:['eris','plutao','haumea']}
  ];
  const Q=shuffle(BANK).slice(0,5).map(x=>({q:x.q,a:x.a,o:shuffle([x.a,...shuffle(x.w).slice(0,2)])}));
  let qi=0,busy=false;
  const ask=()=>{const q=Q[qi];busy=false;
    stage.innerHTML=`<div class="quiz"><div class="qdots">${Q.map((_,i)=>`<i class="${i<qi?'on':i===qi?'now':''}"></i>`).join('')}</div>
      <div class="opts" id="opts">${q.o.map(k=>`<button class="opt" data-k="${k}">${body(k)}<span class="pl-name">${NAMES[k]}</span></button>`).join('')}</div></div>`;
    tell(q.q);
    $('#opts').onclick=e=>{const b=e.target.closest('.opt');if(!b||busy||b.classList.contains('dim'))return;
      if(b.dataset.k===q.a){busy=true;b.classList.add('right');sfx.win();burstAt(b,PARTY,22);say('Isso! '+NAMES[q.a]+'!');qi++;
        later(()=>qi<Q.length?ask():cheer('Sabe tudo!',`Você acertou todas as perguntas, ${state.name}!`,()=>go(12)),1700)}
      else{b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake','dim');sfx.oops();say('Quase! Tente de novo.')}};
  };ask();
},
/* 10 — stars + home */
()=>{
  stage.innerHTML=`<div class="fuel"><span>Energia</span><div class="bar"><i id="fill"></i></div></div><div class="field" id="field"></div>`;
  const f=$('#field'),N=G.stars;
  spots(N).forEach(([x,y])=>{const b=document.createElement('button');b.className='star';b.setAttribute('aria-label','Estrela');
    b.style.cssText=`--x:${x}%;--y:${y}%;--sz:${Math.round(Math.min(f.clientWidth,f.clientHeight*1.15)*(N>5?.15+Math.random()*.03:.18+Math.random()*.05))}px;animation-delay:${-Math.random()*1.5}s`;b.innerHTML=STAR;f.appendChild(b)});
  tell(`O foguete precisa de energia para voltar. Toque nas ${NUM[N-1]} estrelas!`);
  let n=0,home=false;
  f.onclick=e=>{
    if(home){const h=e.target.closest('.earth-home');if(h){home=false;sfx.land();burstAt(h,['#3a8ee6','#5cc46a','#fff'],26);later(()=>go(13),500)}return}
    const b=e.target.closest('.star');if(!b||b.classList.contains('gone'))return;
    b.classList.add('gone');burstAt(b,['#ffc93c','#fff1a8','#ff9a1f'],14);sfx.ding(n*2);n++;
    $('#fill').style.width=(n/N*100)+'%';say(NUM[n-1]+'!');
    if(n===N)later(()=>{f.innerHTML=`<button class="earth-home" aria-label="Terra"><span class="planet p-terra pulse" style="--s:1"></span></button>`;home=true;
      tell('Energia cheia! Agora toque na Terra para voltar para casa.')},800)};
},
/* 11 — medal */
()=>{
  const up=state.name.toUpperCase(),nm=esc(up),fs=up.length>10?14:up.length>7?17:21;
  stage.innerHTML=`<div class="finale">
    <svg class="medal" viewBox="0 0 200 250" role="img" aria-label="Medalha de astronauta">
      <path d="M62 0 H98 L88 96 H52Z" fill="#a99cff"/><path d="M102 0 H138 L148 96 H112Z" fill="#ff5a4e"/>
      <circle cx="100" cy="160" r="80" fill="#e8a91a"/><circle cx="100" cy="160" r="68" fill="#ffc93c" stroke="#fff1a8" stroke-width="4"/>
      <path d="M100 104 L110 132 L140 133 L116 151 L125 180 L100 163 L75 180 L84 151 L60 133 L90 132Z" fill="#fff6d0" stroke="#c48a00" stroke-width="3" stroke-linejoin="round"/>
      <text x="100" y="206" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="${fs}" fill="#6b3a00">${nm}</text>
    </svg>
    <h2>Missão cumprida!</h2>
    <p>O astronauta <b>${nm}</b> montou o foguete, pulou na Lua, pintou um desenho, visitou o Sol e conheceu os planetas e os planetas anões.</p>
    <div class="row"><button class="big go-btn" id="again">Jogar de novo</button><button class="ghost" id="rename">Trocar o nome</button></div></div>`;
  sfx.win();tell(`Parabéns, astronauta ${state.name}! Missão cumprida! Você ganhou a medalha de astronauta!`);
  for(let i=0;i<5;i++)later(()=>burst(innerWidth*(.2+Math.random()*.6),innerHeight*(.2+Math.random()*.4),PARTY,26),i*450);
  $('#again').onclick=()=>{sfx.pop();newGame();go(1)};
  $('#rename').onclick=()=>{sfx.pop();go(0)};
}
];

/* ---------- controls ---------- */
$('#home').onclick=()=>{ctx();if(state.phase===0)return;$('#ask').hidden=false;try{speechSynthesis.cancel()}catch(e){};say('Voltar para o início?')};
$('#askNo').onclick=()=>{$('#ask').hidden=true;say(lastLine)};
$('#askYes').onclick=()=>{$('#ask').hidden=true;$('#cheer').hidden=true;warp=0;go(0)};
const fsEl=document.documentElement;
const fsReq=fsEl.requestFullscreen||fsEl.webkitRequestFullscreen;
const fsNow=()=>document.fullscreenElement||document.webkitFullscreenElement;
if(!fsReq)$('#fs').hidden=true;
const fsPaint=()=>{const on=!!fsNow();$('#fsOn').style.display=on?'none':'';$('#fsOff').style.display=on?'':'none';$('#fs').setAttribute('aria-label',on?'Sair da tela cheia':'Tela cheia')};
document.addEventListener('fullscreenchange',fsPaint);document.addEventListener('webkitfullscreenchange',fsPaint);
$('#fs').onclick=()=>{try{
  if(fsNow()){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
  else{const r=fsReq.call(fsEl);if(r&&r.catch)r.catch(()=>{msg.textContent='Esta tela não deixa abrir em tela cheia aqui. Abra o jogo pelo link no navegador.'})}
}catch(e){}};
$('#replay').onclick=()=>{ctx();say(lastLine||msg.textContent)};
$('#mute').onclick=function(){muted=!muted;this.setAttribute('aria-pressed',muted);this.setAttribute('aria-label',muted?'Som desligado':'Som ligado');
  if(muted){try{speechSynthesis.cancel()}catch(e){}}else say(lastLine)};

function start(data){
  newGame();
  try{const s=JSON.parse(localStorage.getItem('missao-solar')||'{}');if(s.name)state.name=s.name}catch(e){}
  if(data&&data.name)state.name=data.name;
  go(data&&typeof data.phase==='number'&&data.name?data.phase:0);
}
try{window.claude?.hot?.snapshot?.(()=>({name:state.name,phase:state.phase}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>

</body>
</html>
